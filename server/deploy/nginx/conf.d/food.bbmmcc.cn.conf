# food.bbmmcc.cn —— 反向代理到后端 app 容器（compose 服务名 app:3000）
# 证书由 certbot 服务自动签发/续期，路径在 /etc/letsencrypt/live/<域名>/
# 首次签发前请先执行：bash deploy/init-letsencrypt.sh

# HTTP：放行 ACME 验证，其余跳转 HTTPS
server {
    listen 80;
    server_name food.bbmmcc.cn;

    # Let's Encrypt / certbot webroot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：终止 TLS 并反代到后端
server {
    listen 443 ssl;
    http2 on;
    server_name food.bbmmcc.cn;

    ssl_certificate     /etc/letsencrypt/live/food.bbmmcc.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food.bbmmcc.cn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 上传体积上限（按需）
    client_max_body_size 10m;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # AI 接口耗时较长，放宽超时
    }
}
