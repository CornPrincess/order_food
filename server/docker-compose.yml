services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    # 默认不对外暴露端口，仅容器网络内访问。如需本机连库可解开下面两行：
    # ports:
    #   - "127.0.0.1:27017:27017"

  app:
    build: .
    container_name: order_food_app   # 固定容器名，便于已有反代按名访问（共享网络时）
    restart: always
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      # 覆盖 .env，确保容器内指向 mongo 服务名（宿主机无法解析 "mongo"）
      - MONGODB_URI=mongodb://mongo:27017/order_food
      # 容器启动即自动导入种子数据（幂等），无需手动 npm run seed
      - AUTO_SEED=true
    # 仅绑定到本机回环，便于在服务器上调试，不直接对公网暴露（公网走 nginx）
    ports:
      - "127.0.0.1:3000:3000"

  # nginx + certbot 仅在「整机独占部署」时启用：docker compose --profile standalone up -d
  # 若本机已有反向代理（例如同机的 cc_blog 的 nginx），不要启用本服务，避免抢占 80/443。
  nginx:
    image: nginx:1.27-alpine
    restart: always
    profiles: ["standalone"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro      # 证书（与 certbot 共享）
      - ./deploy/certbot/www:/var/www/certbot:ro       # ACME 验证目录
    # 每 6 小时 reload 一次，自动加载续期后的新证书；前台运行 nginx
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: always
    profiles: ["standalone"]
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # 每 12 小时尝试续期一次（未到期则跳过）
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
